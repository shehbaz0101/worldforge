[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldforge"
version = "0.1.0"
description = "Latent world model for a scientific dynamics sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shehbaz Pathan" }]
keywords = ["world-models", "scientific-ml", "latent-dynamics", "scientific-computing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    # Day 7 HTTP API. `worldforge serve` imports these. Prediction, planning,
    # and training routes still need the ml extra; GET /health does not.
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # TestClient follows Starlette and imports httpx2 when it is installed.
    "httpx2>=2.0",
]
# Day 3 latent model, the Day 4 trainer, the Day 5 open-loop eval, the Day 6
# planner, the Day 7 predict, plan, and train routes, and Day 9
# `worldforge demo`. Not required for the environment, schema, corpus
# commands, `worldforge serve`, or GET /health.
# CI installs a CPU wheel before this extra so the test job does not pull a
# CUDA build. Model, train, prediction, planning, and API tests import torch.
ml = [
    "torch>=2.2,<3",
    # Torch warns on import when NumPy is missing. The model code does not
    # call NumPy; this keeps ``model-info`` stderr empty.
    "numpy>=1.26",
]
# Optional. CI runs `ruff check` with the selection below. Not required to
# import or run WorldForge.
lint = ["ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/shehbaz0101/worldforge"
Repository = "https://github.com/shehbaz0101/worldforge"

[project.scripts]
worldforge = "worldforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Bug-finding checks plus import order. E501 is omitted so later days are not
# restyled for line length. `ruff check` in CI uses this selection.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest's tmp_path under the repo. The Day 8 sandbox defaults to the
# current directory, and the existing corpus and checkpoint tests pass
# absolute paths from that temporary tree.
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["src"]
markers = [
    "integration: live checks; none are registered. HTTP tests use TestClient and are not marked.",
]
